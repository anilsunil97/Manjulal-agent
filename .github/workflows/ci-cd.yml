name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: CI — Lint & validate ───────────────────────────────────────────
  ci:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax (py_compile)
        run: python -m py_compile app.py && echo "✅ Syntax OK"

      - name: Lint with flake8
        run: |
          pip install flake8 --quiet
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues but don't fail
          flake8 app.py --count --exit-zero --max-line-length=120 --statistics

      - name: Verify required files exist
        run: |
          test -f app.py        && echo "✅ app.py found"
          test -f requirements.txt && echo "✅ requirements.txt found"
          test -d petpooja_docs && echo "✅ petpooja_docs folder found" || (mkdir petpooja_docs && echo "📁 petpooja_docs created")

  # ── Job 2: CD — Deploy to Streamlit Community Cloud ──────────────────────
  # Streamlit Community Cloud auto-deploys from GitHub on push to main.
  # This job notifies and validates the deployment is ready.
  cd:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm deployment-ready
        run: |
          echo "✅ CI passed. Code is ready for deployment."
          echo "🚀 Streamlit Community Cloud will auto-deploy from this push."
          echo "   App URL: https://<your-app-name>.streamlit.app"
          echo ""
          echo "── Deployment checklist ──────────────────────────────────────"
          echo "  1. Repo is connected to Streamlit Community Cloud"
          echo "  2. Secrets (GROQ_API_KEY, GOOGLE_API_KEY) set in Streamlit Cloud"
          echo "  3. Main file: app.py"
          echo "  4. Python version: 3.11"
          echo "─────────────────────────────────────────────────────────────"
